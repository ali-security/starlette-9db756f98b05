name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    name: "Publish release"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    environment:
      name: deploy

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
      - name: "Install dependencies"
        run: "scripts/install"
      # `scripts/build` chains a `twine check` metadata gate and a docs build onto
      # `python -m build`; neither affects the distributions, and the pinned twine
      # rejects the metadata version emitted by the current hatchling.
      - name: "Build package"
        run: "python -m build"
